<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Nexus Tracker – Server address</title>
  <style>
    body { font-family: Inter, system-ui, Segoe UI, sans-serif; margin: 0; padding: 24px; color: #1f2330; background: #f7f8fa; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { color: #6b7280; margin: 0 0 16px; font-size: 13.5px; line-height: 1.5; }
    .warn { color: #b45309; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 8px 10px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d6dae3; border-radius: 8px; font: inherit; }
    input:focus { outline: none; border-color: #7b68ee; box-shadow: 0 0 0 3px rgba(123,104,238,.15); }
    .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    button { padding: 9px 14px; border-radius: 8px; border: 1px solid #d6dae3; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: #7b68ee; border-color: #7b68ee; color: #fff; }
    .err { color: #dc2626; font-size: 12.5px; min-height: 16px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Server address</h1>
  <p id="intro">The web address where your Nexus Work server runs, for example <b>https://nexus.yourcompany.com</b>. On this computer it is usually <b>http://localhost:5000</b>.</p>
  <p id="offline" class="warn" hidden>Could not reach the server. Check the address, or make sure the server is running, then save to try again.</p>
  <form id="form">
    <input id="url" type="url" required placeholder="http://localhost:5000" autocomplete="off" />
    <div class="err" id="err"></div>
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" type="submit">Save and connect</button>
    </div>
  </form>
  <script src="settings.js"></script>
</body>
</html>
